
<svg xmlns="http://www.w3.org/2000/svg"
     width="64"
     height="64"
     viewBox="0 0 64 64">

  <!-- Fondo oscuro con esquinas redondeadas -->
  <rect
    width="64"
    height="64"
    rx="14"
    fill="#080e1b"
  />

  <!-- Resplandor exterior -->
  <rect
    x="12"
    y="19"
    width="40"
    height="28"
    rx="5"
    fill="none"
    stroke="#087bff"
    stroke-width="5"
    opacity="0.35"
  />

  <!-- Contorno del sobre -->
  <rect
    x="12"
    y="19"
    width="40"
    height="28"
    rx="5"
    fill="#101a2b"
    stroke="#6688ff"
    stroke-width="2.5"
  />

  <!-- Solapa -->
  <path
    d="M14 22 L32 36 L50 22"
    fill="none"
    stroke="#22d3ee"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Líneas inferiores del sobre -->
  <path
    d="M14 44 L25 34 M50 44 L39 34"
    fill="none"
    stroke="#6688ff"
    stroke-width="2.5"
    stroke-linecap="round"
  />

</svg>
